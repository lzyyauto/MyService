services:
  web:
    build: .
    environment:
      APP_NAME: z-collection-system-functional
      DEBUG: "False"
      ENVIRONMENT: testing
      ENABLE_PUBLIC_REQUEST_DUMP: "false"
      POSTGRES_USER: functional
      POSTGRES_PASSWORD: functional
      POSTGRES_DB: functional
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      POSTGRES_DATA_DIR: /var/lib/postgresql/data
      NOTION_TOKEN: ""
      NOTION_SLEEP_DATABASE_ID: ""
      NOTION_WAKE_DATABASE_ID: ""
      BARK_DEFAULT_DEVICE_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FUNCTIONAL_TEST_PORT:-18080}:8000"
    command: >
      sh -c "python -c 'from app.db.init_db import init_db; init_db()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: functional
      POSTGRES_PASSWORD: functional
      POSTGRES_DB: functional
    ports:
      - "${FUNCTIONAL_TEST_DB_PORT:-15432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U functional -d functional
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
