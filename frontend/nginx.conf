server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # BACKEND_UPSTREAM 在容器启动时由 envsubst 写入；变量形式的 proxy_pass 会按 Docker DNS
    # 周期重新解析，避免 web 容器重建后保留旧 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_origin http://${BACKEND_UPSTREAM};

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 容器健康检查使用该路径，确认 Nginx 不只是在提供静态文件，也能访问 API。
    location = /api/health {
        proxy_pass $backend_origin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 变量形式的 proxy_pass 不会自动保留匹配到的路径；显式转发完整 URI 和查询参数。
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
