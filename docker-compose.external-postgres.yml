# 外部 PostgreSQL 部署：本文件绝不创建 db 服务。
# POSTGRES_HOST、POSTGRES_PORT、POSTGRES_USER、POSTGRES_PASSWORD、POSTGRES_DB 均来自 .env。
services:
  migrate:
    build: .
    image: lzyyauto/myservice:latest
    env_file:
      - .env
    restart: "no"
    init: true
    command:
      ["sh", "-ec", "python -m app.db.migration_baseline && alembic upgrade head"]

  web:
    build: .
    image: lzyyauto/myservice:latest
    env_file:
      - .env
    ports:
      - "${MYSERVICE_PORT:-20035}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    image: lzyyauto/myservice-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM: web:8000
      NGINX_ENVSUBST_FILTER: BACKEND_UPSTREAM
    depends_on:
      web:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true

  notion-delivery:
    build: .
    image: lzyyauto/myservice:latest
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.notion_delivery"]

  feishu-inspiration:
    profiles:
      - inspiration
    build: .
    image: lzyyauto/myservice:latest
    env_file:
      - .env
    environment:
      INSPIRATION_DOC_PATH: /app/data/inspirations.md
    volumes:
      - ${MYSERVICE_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.feishu_inspiration"]
