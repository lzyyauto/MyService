[project]
name = "z-collection-system"
version = "1.0.0"
description = "用于收集和整理个人数据的服务"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp==3.8.6",
    "alembic==1.12.1",
    "fastapi==0.104.1",
    "lark-oapi==1.5.3",
    "notion-client==2.2.1",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.1.0",
    "pydantic==2.5.2",
    "python-dotenv==1.0.0",
    "requests==2.33.0",
    "sqlalchemy==2.0.23",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio==0.26.0",
    "pytest-cov==4.1.0",
    "pytest==8.2.0",
]
legacy = [
    "httpx==0.25.2",
    "telethon==1.32.1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
