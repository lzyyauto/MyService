services:
  web:
    build: .
    image: lzyyauto/myservice:latest
    container_name: Myservice
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - ENABLE_PUBLIC_REQUEST_DUMP=${ENABLE_PUBLIC_REQUEST_DUMP:-false}
      # 你可以加更多自定义环境变量
    depends_on:
      - db
    volumes:
      - .:/app  # 只建议开发用，生产建议去掉
      - /app/.venv  # 避免宿主机虚拟环境覆盖容器内 Linux 环境
    restart: unless-stopped
    command: >
      sh -c "python -c 'from app.db.init_db import init_db; init_db()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # 生产环境建议去掉 --reload

  notion-delivery:
    build: .
    image: lzyyauto/myservice:latest
    container_name: NotionDelivery
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=db
    depends_on:
      - db
    volumes:
      - .:/app  # 只建议开发用，生产建议去掉
      - /app/.venv
    restart: unless-stopped
    command: >
      sh -c "python -c 'from app.db.init_db import init_db; init_db()' &&
             python -m app.workers.notion_delivery"

  feishu-inspiration:
    profiles:
      - inspiration
    build: .
    image: lzyyauto/myservice:latest
    container_name: FeishuInspiration
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - INSPIRATION_DOC_PATH=/app/data/inspirations.md
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: python -m app.workers.feishu_inspiration

  db:
    image: postgres:15
    container_name: Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

volumes:
  postgres_data:
