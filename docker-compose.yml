# 默认部署：本 Compose 自带 PostgreSQL。生产数据库不会暴露到宿主机端口。
# 如需使用已有 PostgreSQL，请改用 docker-compose.external-postgres.yml。
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: ${MYSERVICE_BACKEND_IMAGE:-lzyyauto/myservice}:${MYSERVICE_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true
    command:
      ["sh", "-ec", "python -m app.db.migration_baseline && alembic upgrade head"]

  web:
    image: ${MYSERVICE_BACKEND_IMAGE:-lzyyauto/myservice}:${MYSERVICE_IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENABLE_PUBLIC_REQUEST_DUMP: ${ENABLE_PUBLIC_REQUEST_DUMP:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${MYSERVICE_FRONTEND_IMAGE:-lzyyauto/myservice-frontend}:${MYSERVICE_IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM: web:8000
      NGINX_ENVSUBST_FILTER: BACKEND_UPSTREAM
    depends_on:
      web:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true

  notion-delivery:
    image: ${MYSERVICE_BACKEND_IMAGE:-lzyyauto/myservice}:${MYSERVICE_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.notion_delivery"]

  feishu-inspiration:
    profiles:
      - inspiration
    image: ${MYSERVICE_BACKEND_IMAGE:-lzyyauto/myservice}:${MYSERVICE_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      INSPIRATION_DOC_PATH: /app/data/inspirations.md
    volumes:
      - ${MYSERVICE_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    command: ["python", "-m", "app.workers.feishu_inspiration"]

volumes:
  postgres_data:
